name: Publish Swift artifact bundle

# Deliberately triggered by a NON-semver `pdf-inspector-rust-*` tag, never a
# plain `X.Y.Z` one. SwiftPM parses tags via `Version(tag:)` and skips anything
# that isn't semver, so these artifact tags stay invisible to package
# resolution. The release must be published under one of these tags BEFORE the
# matching semver tag is cut, otherwise a client could resolve a version whose
# Package.swift references a release that doesn't exist yet.
on:
  push:
    tags:
      - 'pdf-inspector-rust-*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  FRAMEWORK_NAME: pdf_inspector
  LIB_NAME: libpdf_inspector
  MACOSX_DEPLOYMENT_TARGET: "15.0"
  IPHONEOS_DEPLOYMENT_TARGET: "18.0"
  TVOS_DEPLOYMENT_TARGET: "18.0"
  WATCHOS_DEPLOYMENT_TARGET: "11.0"
  XROS_DEPLOYMENT_TARGET: "2.0"

jobs:
  apple-build:
      name: Build Apple slices
      runs-on: macos-latest
      env:
        TARGETS: "aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-macabi,aarch64-apple-ios-sim,aarch64-apple-tvos,aarch64-apple-tvos-sim,aarch64-apple-visionos,aarch64-apple-visionos-sim,aarch64-apple-watchos,aarch64-apple-watchos-sim,x86_64-apple-ios,x86_64-apple-ios-macabi"

      steps:
          - uses: actions/checkout@v4

          - name: Install Rust
            uses: dtolnay/rust-toolchain@stable
            with:
              targets: ${{ env.TARGETS }}

          - name: Build host dylib for bindgen
            run: cargo build --release --features uniffi

          - name: Generate Swift bindings
            run: |
              mkdir -p swift
              cargo run --release --features uniffi --bin uniffi-bindgen -- generate \
                --library "target/release/${LIB_NAME}.dylib" \
                --language swift \
                --out-dir swift

          - name: Build Apple Rust slices
            run: |
              RUST_TARGETS=()

              # Split by comma and populate the array safely
              IFS=',' read -ra ADDR <<< "$TARGETS"
              for target in "${ADDR[@]}"; do
                  RUST_TARGETS+=("--target" "$target")
              done

              # Run your build command
              cargo build --release --features uniffi "${RUST_TARGETS[@]}"

          - name: Stage headers (Rename & Move)
            run: |
              mkdir -p target/apple/headers
              cp swift/pdf_inspectorFFI.h target/apple/headers/
              cp swift/pdf_inspectorFFI.modulemap target/apple/headers/module.modulemap
              rm -f swift/pdf_inspectorFFI.h swift/pdf_inspectorFFI.modulemap

          # Most of our targets are all for separate architectures, however the iOS Simulator and Mac Catalyst have multiple targets
          # for a single architecture. Combine those into a single slice here. Re-merge each macOS slice through ld -r so Xcode 26
          # gets LC_BUILD_VERSION (not the deprecated LC_VERSION_MIN_MACOSX) and classifies the slice as arm64e-compatible on
          # Apple Silicon hosts.
          - name: Create multi-arch slices (macOS & iOS Simulator & Mac Catalyst)
            run: |
                MACOS_SDK=$(xcrun --sdk macosx --show-sdk-version)
                REPO_ROOT="$(pwd)"
                mkdir -p target/apple/multi/ios-simulator target/apple/multi/ios-macabi target/apple/multi/macos

                for arch in arm64 x86_64; do
                  if [ "$arch" = "arm64" ]; then
                    RUST_TARGET="aarch64-apple-darwin"
                  else
                    RUST_TARGET="x86_64-apple-darwin"
                  fi
                  workdir="$(mktemp -d)"
                  (
                    cd "$workdir"
                    ar x "${REPO_ROOT}/target/${RUST_TARGET}/release/${LIB_NAME}.a"
                    ld -r -S -arch "${arch}" \
                      -platform_version macos "${MACOSX_DEPLOYMENT_TARGET}" "${MACOS_SDK}" \
                      ./*.o -o merged.o
                    libtool -static -o "${REPO_ROOT}/target/${RUST_TARGET}/release/${LIB_NAME}_merged.a" merged.o
                  )
                  rm -rf "$workdir"
                done

                lipo -create \
                  "target/aarch64-apple-darwin/release/${LIB_NAME}_merged.a" \
                  "target/x86_64-apple-darwin/release/${LIB_NAME}_merged.a" \
                  -output "target/apple/multi/macos/${LIB_NAME}.a"

                lipo -create \
                  "target/aarch64-apple-ios-sim/release/${LIB_NAME}.a" \
                  "target/x86_64-apple-ios/release/${LIB_NAME}.a" \
                  -output "target/apple/multi/ios-simulator/${LIB_NAME}.a"
                lipo -create \
                  "target/aarch64-apple-ios-macabi/release/${LIB_NAME}.a" \
                  "target/x86_64-apple-ios-macabi/release/${LIB_NAME}.a" \
                  -output "target/apple/multi/ios-macabi/${LIB_NAME}.a"

          # Lay out every slice + the shared headers exactly as they need to sit
          # inside the final .artifactbundle (one dir per platform, one shared
          # include/), so the assemble job just adds info.json and zips — no
          # path logic duplicated between jobs.
          - name: Stage slices for upload
            run: |
              STAGE="stage/artifactbundle"
              mkdir -p "$STAGE/include"
              cp target/apple/headers/pdf_inspectorFFI.h "$STAGE/include/"
              cp target/apple/headers/module.modulemap "$STAGE/include/"

              SLICES=(
                "macos|target/apple/multi/macos/${LIB_NAME}.a"
                "ios|target/aarch64-apple-ios/release/${LIB_NAME}.a"
                "ios-simulator|target/apple/multi/ios-simulator/${LIB_NAME}.a"
                "ios-macabi|target/apple/multi/ios-macabi/${LIB_NAME}.a"
                "tvos|target/aarch64-apple-tvos/release/${LIB_NAME}.a"
                "tvos-simulator|target/aarch64-apple-tvos-sim/release/${LIB_NAME}.a"
                "visionos|target/aarch64-apple-visionos/release/${LIB_NAME}.a"
                "visionos-simulator|target/aarch64-apple-visionos-sim/release/${LIB_NAME}.a"
                "watchos|target/aarch64-apple-watchos/release/${LIB_NAME}.a"
                "watchos-simulator|target/aarch64-apple-watchos-sim/release/${LIB_NAME}.a"
              )

              for entry in "${SLICES[@]}"; do
                  dir="${entry%%|*}"
                  src="${entry#*|}"
                  mkdir -p "$STAGE/$dir"
                  cp "$src" "$STAGE/$dir/${LIB_NAME}.a"
              done

              cp swift/pdf_inspector.swift stage/pdf_inspector.swift

          - name: Upload Apple slices
            uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
            with:
                name: apple-slices
                path: stage/
                if-no-files-found: error

  assemble-artifactbundle:
      name: Assemble Artifact Bundle
      needs: apple-build
      runs-on: macos-latest
      steps:
          # Full history: the commit step below pushes to a branch, and pushing
          # from the default shallow clone can be rejected ("shallow update not
          # allowed").
          - uses: actions/checkout@v4
            with:
              fetch-depth: 0

          - name: Download Apple slices
            uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
            with:
              name: apple-slices
              path: stage

          - name: Restore Swift bindings
            run: |
              mkdir -p swift
              cp stage/pdf_inspector.swift swift/pdf_inspector.swift

          # SwiftPM triples are NOT Rust target triples (note "macosx" not
          # "macos", "-simulator" not "-sim", "xros" for visionOS).
          # macOS/iOS-device/iOS-simulator/Catalyst are confirmed against a
          # working SE-0482 artifact bundle; tvOS/watchOS/visionOS are
          # confirmed against LLVM's canonical triple table (rust-lang/
          # cc-rs's generated.rs) plus independent corroboration from
          # swiftlang/swift, Kotlin/Native, and LLDB.
          - name: Assemble artifact bundle
            run: |
              VERSION=$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"])')
              BUNDLE="swift/${FRAMEWORK_NAME}.artifactbundle"

              rm -rf "$BUNDLE"
              cp -R stage/artifactbundle "$BUNDLE"

              MANIFEST=(
                "macos|arm64-apple-macosx,x86_64-apple-macosx"
                "ios|arm64-apple-ios"
                "ios-simulator|arm64-apple-ios-simulator,x86_64-apple-ios-simulator"
                "ios-macabi|arm64-apple-ios-macabi,x86_64-apple-ios-macabi"
                "tvos|arm64-apple-tvos"
                "tvos-simulator|arm64-apple-tvos-simulator"
                "visionos|arm64-apple-xros"
                "visionos-simulator|arm64-apple-xros-simulator"
                "watchos|arm64-apple-watchos"
                "watchos-simulator|arm64-apple-watchos-simulator"
              )

              rm -f /tmp/artifactbundle-manifest.tsv
              for entry in "${MANIFEST[@]}"; do
                  dir="${entry%%|*}"
                  triples="${entry#*|}"
                  printf '%s\t%s\t%s\n' "$dir" "${LIB_NAME}.a" "$triples" >> /tmp/artifactbundle-manifest.tsv
              done

              python3 scripts/generate-artifactbundle-info.py \
                "$FRAMEWORK_NAME" "$VERSION" /tmp/artifactbundle-manifest.tsv "$BUNDLE/info.json"

          - name: Zip artifact bundle for distribution
            run: |
              cd swift
              zip -r -y $FRAMEWORK_NAME.artifactbundle.zip $FRAMEWORK_NAME.artifactbundle

          - name: Compute checksum for Package.swift binaryTarget
            id: checksum
            run: |
              CHECKSUM=$(swift package compute-checksum "swift/${FRAMEWORK_NAME}.artifactbundle.zip")
              echo "$CHECKSUM" > "swift/${FRAMEWORK_NAME}.artifactbundle.zip.checksum"
              echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

              VERSION=$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"])')
              URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/pdf-inspector-rust-${VERSION}/${FRAMEWORK_NAME}.artifactbundle.zip"

              # Surface the two values that have to be pasted into Package.swift
              # by hand before the matching semver tag is cut.
              {
                echo "### Package.swift binaryTarget"
                echo
                echo 'Update `Package.swift`, commit, then tag `'"${VERSION}"'`:'
                echo
                echo '```swift'
                echo "let artifactBundleVersion = \"${VERSION}\""
                echo "let artifactBundleChecksum = \"${CHECKSUM}\""
                echo '```'
                echo
                echo "Resolved URL: \`${URL}\`"
              } >> "$GITHUB_STEP_SUMMARY"

          - name: Upload artifact bundle
            uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
            with:
                name: apple-artifactbundle
                path: |
                    swift/${{ env.FRAMEWORK_NAME }}.artifactbundle.zip
                    swift/${{ env.FRAMEWORK_NAME }}.artifactbundle.zip.checksum
                if-no-files-found: error

          # Publishes under the pdf-inspector-rust-* tag that triggered this run.
          # This release must exist before the matching semver tag is pushed —
          # see the trigger comment at the top of this file.
          - name: Release
            uses: softprops/action-gh-release@v3
            if: github.ref_type == 'tag'
            with:
              name: PDF Inspector Rust artifactbundle ${{ github.ref_name }}
              body: |
                Rust artifact bundle for the Swift package.

                `Package.swift` binaryTarget checksum:

                ```
                ${{ steps.checksum.outputs.checksum }}
                ```
              files: |
                  swift/${{ env.FRAMEWORK_NAME }}.artifactbundle.zip
                  swift/${{ env.FRAMEWORK_NAME }}.artifactbundle.zip.checksum

          # Runs only after the release above succeeded, so Package.swift is
          # never pointed at a release that doesn't exist. Commits onto
          # PACKAGE_BRANCH (not the tag — tags are detached), which means the
          # semver tag you cut afterwards must be on this new commit:
          #
          #   git pull && git tag <version> && git push --tags
          #
          # The regenerated Swift bindings are committed alongside so the
          # checked-in wrapper always matches the binary that was just released.
          - name: Commit pinned Package.swift and regenerated bindings
            if: github.ref_type == 'tag'
            env:
              PACKAGE_BRANCH: main
              CHECKSUM: ${{ steps.checksum.outputs.checksum }}
            run: |
              set -euo pipefail

              VERSION=$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"])')

              # stage/ is untracked, so the freshly generated bindings survive
              # the branch switch below.
              git fetch origin "$PACKAGE_BRANCH"
              git checkout -B "$PACKAGE_BRANCH" "origin/${PACKAGE_BRANCH}"

              cp stage/pdf_inspector.swift swift/pdf_inspector.swift
              sed -i '' -E \
                -e "s|^let artifactBundleVersion = \".*\"|let artifactBundleVersion = \"${VERSION}\"|" \
                -e "s|^let artifactBundleChecksum = \".*\"|let artifactBundleChecksum = \"${CHECKSUM}\"|" \
                Package.swift

              # sed silently no-ops if the anchors ever drift; fail loudly
              # rather than pushing a manifest with a stale checksum.
              grep -qF "let artifactBundleVersion = \"${VERSION}\"" Package.swift
              grep -qF "let artifactBundleChecksum = \"${CHECKSUM}\"" Package.swift

              if git diff --quiet -- Package.swift swift/pdf_inspector.swift; then
                echo "Package.swift and bindings already up to date; nothing to commit."
                exit 0
              fi

              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add Package.swift swift/pdf_inspector.swift
              git commit -m "chore(swift): pin artifact bundle ${VERSION}

              Generated by ${GITHUB_WORKFLOW} for tag ${GITHUB_REF_NAME}."
              git push origin "$PACKAGE_BRANCH"

              echo "Committed to ${PACKAGE_BRANCH}. Now: git pull && git tag ${VERSION} && git push --tags" >> "$GITHUB_STEP_SUMMARY"
